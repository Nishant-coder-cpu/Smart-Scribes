name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    name: Web app (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web-Application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web-Application/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          # Placeholders: the build only needs these to be set, not to be real.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_GCS_BUCKET_NAME: smart-scribes
          NEXT_TELEMETRY_DISABLED: 1

  pipeline:
    name: Python pipeline (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python_Codes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Python_Codes/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: pytest -q
